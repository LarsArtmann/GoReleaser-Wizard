# GoReleaser configuration
# Generated by goreleaser-wizard
# https://goreleaser.com

version: 2

project_name: golden-app

before:
  hooks:
    - go mod tidy

builds:
  - id: golden-app
    main: ./cmd/golden-app
    binary: golden-app
    
    env:
      - CGO_ENABLED=0
    
    goos:
      - linux
      - darwin

    goarch:
      - amd64
      - arm64


    # Ignore certain platform combinations
    ignore:
      - goos: darwin
        goarch: 386
      - goos: windows
        goarch: arm64



archives:
  - id: default
    name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}_{{.Arch}}"
    
    format_overrides:
      - goos: windows
        formats: [zip]
    
    files:
      - LICENSE*
      - README*
      - CHANGELOG*

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{incpatch .Version}}-next"
changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: "golden-owner"
    name: "golden-repo"
  draft: false
  prerelease: auto

  footer: |
    ## Installation
    Download the appropriate archive for your platform from the assets below.


dockers_v2:
  - id: golden-app
    images:
      - "ghcr.io/golden-app"

    tags:
      - "{{.Tag}}"
      - "v{{.Major}}"
      - "{{if not .IsNightly}}latest{{end}}"

    dockerfile: Dockerfile

    platforms:
      - linux/amd64
      - linux/arm64

    annotations:
      org.opencontainers.image.created: "{{.Date}}"
      org.opencontainers.image.title: "{{.ProjectName}}"
      org.opencontainers.image.revision: "{{.FullCommit}}"
      org.opencontainers.image.version: "{{.Version}}"

