name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build
        env:
          GOEXPERIMENT: jsonv2
        run: go build ./...

      - name: Vet
        env:
          GOEXPERIMENT: jsonv2
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          args: ./...
        env:
          GOEXPERIMENT: jsonv2

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Test
        env:
          GOEXPERIMENT: jsonv2
        run: go test -race ./...

      - name: Generate golden diff check
        env:
          GOEXPERIMENT: jsonv2
        run: go test ./cmd/goreleaser-wizard -run TestGolden -count=1

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          install-only: true

      # The wizard's product IS its generated config: if this step regresses,
      # every project using the wizard ships broken releases.
      - name: Generated fixture passes goreleaser check
        env:
          GOEXPERIMENT: jsonv2
        run: go test ./cmd/goreleaser-wizard -run TestGeneratedConfigPassesGoReleaserCheck -v -count=1
